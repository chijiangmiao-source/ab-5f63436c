services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fiber-braid-review:latest
    ports:
      # 宿主机端口可通过环境变量 WEB_PORT 配置，默认 8080
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 2s

  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    image: fiber-braid-review-verify:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      SMOKE_URL: "http://web/"
    restart: "no"

# 典型用法：
#   启动页面：       WEB_PORT=9090 docker compose up -d web
#   一键验收并退出： docker compose up --abort-on-container-exit --exit-code-from verify
#   单独运行验收：   docker compose run --rm verify
